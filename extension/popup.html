<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat Saver</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img src="icons/icon-96.png" alt="" width="36" height="36" class="logo">
    <div class="head-text">
      <h1>Chat Saver</h1>
      <p class="site"><span id="site">This page</span><span id="app" class="chip" hidden></span></p>
    </div>
  </header>

  <main>
    <button class="btn btn-primary hero" id="save-tab">
      <span data-icon="download-simple" data-size="22"></span>
      <span class="hero-text"><strong>Save this chat</strong><small>PDF + TXT + Markdown · whole history</small></span>
    </button>

    <form id="link-form" class="link-box" autocomplete="off">
      <label for="link" class="setting-label">…or paste a chat link</label>
      <div class="link-row">
        <input id="link" type="url" inputmode="url" placeholder="https://chatgpt.com/c/…" spellcheck="false">
        <button class="btn" type="submit" id="save-link">Save</button>
      </div>
    </form>

    <details class="more">
      <summary>One format only</summary>
      <div class="pair">
        <button class="btn" data-format="pdf"><span data-icon="file-pdf"></span>PDF</button>
        <button class="btn" data-format="txt"><span data-icon="file-txt"></span>Text</button>
        <button class="btn" data-format="md"><span data-icon="file-md"></span>Markdown</button>
        <button class="btn" data-format="view"><span data-icon="printer"></span>Reading view</button>
      </div>
    </details>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <footer class="foot">
    <span>Files go to Downloads ▸ Chat Saver</span>
    <span><span class="kbd">⌥</span><span class="kbd">⇧</span><span class="kbd">S</span></span>
  </footer>
  <script src="icons.js"></script>
  <script src="popup.js"></script>
</body>
</html>
